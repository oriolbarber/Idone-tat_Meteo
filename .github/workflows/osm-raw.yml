# Temporal: baixa els llocs d'escalada de Catalunya d'OpenStreetMap (Overpass) a la branca osm-raw.
name: OSM cru (prova)
on: workflow_dispatch
permissions: {contents: write}
jobs:
  raw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Overpass
        run: |
          curl -sS -m 300 --retry 3 --data-urlencode "data@tools/osm-query.txt" https://overpass-api.de/api/interpreter -o osm-raw.json
          ls -l osm-raw.json
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan osm-raw; git rm -rqf --cached .; git add osm-raw.json; git commit -qm "OSM cru"; git push -f origin osm-raw
