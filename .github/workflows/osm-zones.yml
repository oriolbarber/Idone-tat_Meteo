# Actualitza zones-osm.js amb els llocs d'escalada de Catalunya d'OpenStreetMap (cada dilluns i a mà des d'Actions).
name: Zones d'OpenStreetMap
on:
  schedule: [{cron: "17 4 * * 1"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: osm-zones, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # l'historial cal per saber quants dies fa de l'última actualització
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Baixa d'OpenStreetMap (Overpass)
        id: raw
        run: bash tools/osm-raw.sh
      - name: Construeix zones-osm.js
        if: steps.raw.outputs.skip != '1'
        run: node tools/osm-build.mjs osm-raw.json | tee "$RUNNER_TEMP/n.txt"; echo "::notice::$(cat $RUNNER_TEMP/n.txt)"
      - name: Desa els canvis
        if: steps.raw.outputs.skip != '1'
        run: |
          git add zones-osm.js
          if git diff --cached --quiet; then echo "Sense canvis"; exit 0; fi
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git commit -qm "Zones d'OpenStreetMap actualitzades ($(cat $RUNNER_TEMP/n.txt))"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && exit 0; sleep 10; done; exit 1
