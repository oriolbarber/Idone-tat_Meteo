# Temporal: baixa els llocs d'escalada de Catalunya d'OpenStreetMap (Overpass) a la branca osm-raw.
name: OSM cru (prova)
on: workflow_dispatch
permissions: {contents: write}
jobs:
  raw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Overpass
        run: |
          for u in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            curl -sS -m 300 -A "CEM-Idoneitat/1.0 (https://github.com/oriolbarber/Idone-tat_Meteo)" -H "Accept: application/json" --data-urlencode "data@tools/osm-query.txt" "$u" -o osm-raw.json && head -c 1 osm-raw.json | grep -q "{" && break
            echo "Falla $u"; head -c 300 osm-raw.json; sleep 20
          done
          ls -l osm-raw.json
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan osm-raw; git rm -rqf --cached .; git add osm-raw.json; git commit -qm "OSM cru"; git push -f origin osm-raw
