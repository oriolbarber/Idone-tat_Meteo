# Dades de previsió per a l'app, cada 3 hores, publicades a la branca «dades» (un sol commit que es reescriu: no omple
# l'historial de main ni torna a publicar l'app). L'app les llegeix de raw.githubusercontent.com; si no hi són o són
# velles (> 12 h), les demana a Open-Meteo des del mòbil com abans.
#   fc.json   previsió en brut de totes les zones (tools/fc-build.mjs): cada mòbil hi aplica els seus llindars
#   heat.json capa «Idoneïtat amb colors» ja calculada (tools/heat-build.mjs)
name: Dades de previsió
on:
  # Cada hora, però només es calcula si les dades publicades tenen ≥ 2 h 30 min: GitHub endarrereix o se salta
  # execucions programades (fins a 5–9 h entre dades, 30-10 i 31-10-2026) i així es recupera a l'hora següent sense
  # gastar més crides a Open-Meteo que «cada 3 h».
  schedule: [{cron: "23 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: dades, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Cal tornar a calcular?
        id: age
        run: |
          git fetch -q --depth 1 origin dades 2>/dev/null && last=$(git log -1 --format=%ct FETCH_HEAD) || last=0
          age=$(( $(date +%s) - last ))
          if [ "${{ github.event_name }}" = "schedule" ] && [ $age -lt 9000 ]; then echo "go=0" >> $GITHUB_OUTPUT; echo "::notice::Dades de fa $((age/60)) min: no cal"; else echo "go=1" >> $GITHUB_OUTPUT; fi
      - uses: actions/setup-node@v4
        if: steps.age.outputs.go == '1'
        with: {node-version: 22}
      - name: Previsió de les zones (fc.json)
        if: steps.age.outputs.go == '1'
        continue-on-error: true
        shell: bash
        run: set -o pipefail; node tools/fc-build.mjs "$RUNNER_TEMP/fc.json" | tee "$RUNNER_TEMP/fc.txt"; echo "::notice::$(tail -1 $RUNNER_TEMP/fc.txt)"
      - name: Capa d'idoneïtat (heat.json)
        if: steps.age.outputs.go == '1'
        continue-on-error: true
        shell: bash
        run: set -o pipefail; node tools/heat-build.mjs "$RUNNER_TEMP/heat.json" | tee "$RUNNER_TEMP/heat.txt"; echo "::notice::$(tail -1 $RUNNER_TEMP/heat.txt)"
      - name: Publica a la branca «dades»
        if: steps.age.outputs.go == '1'
        run: |
          # Si un dels dos fitxers no s'ha pogut fer, es publica l'altre i es manté l'anterior (abans no es publicava res)
          new=0
          for f in fc.json heat.json; do
            if [ -s "$RUNNER_TEMP/$f" ]; then new=1; else git show FETCH_HEAD:$f > "$RUNNER_TEMP/$f" 2>/dev/null && echo "::warning::$f no s'ha pogut fer: es manté l'anterior" || { echo "::error::$f no existeix"; exit 1; }; fi
          done
          [ $new = 1 ] || { echo "::error::Open-Meteo no ha respost: res de nou per publicar"; exit 1; }
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan dades-tmp
          git rm -rqf .
          cp "$RUNNER_TEMP/fc.json" "$RUNNER_TEMP/heat.json" .
          printf '%s\n' "# Dades calculades (no editar)" "Les genera .github/workflows/dades.yml (branca main) cada 3 h." "fc.json: previsió de les zones · heat.json: capa d'idoneïtat." "Previsió: Open-Meteo (CC BY 4.0)." > README.md
          git add fc.json heat.json README.md
          git commit -qm "Dades de previsió $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push -qf origin HEAD:dades && exit 0; sleep 15; done; exit 1   # reintents: un error puntual de xarxa no fa perdre l'actualització
